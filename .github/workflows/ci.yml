name: CI

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Package the plugin
        run: |
          mkdir -p dist/mdxcn
          cp main.js manifest.json styles.css dist/mdxcn/
          (cd dist && zip -r mdxcn.zip mdxcn)

      - uses: actions/upload-artifact@v4
        with:
          name: mdxcn
          path: dist/mdxcn

      # A tag publishes the release: only the plugin files, plus a zip of them.
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          test "$TAG" = "$(node -p "require('./manifest.json').version")" || { echo "Tag $TAG does not match manifest.json"; exit 1; }
          FILES="main.js manifest.json styles.css dist/mdxcn.zip"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" $FILES --clobber
          else
            gh release create "$TAG" $FILES --title "MDXCN $TAG" --generate-notes
          fi
