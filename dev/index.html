<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MDXCN preview</title>
    <link rel="stylesheet" href="../styles.css" />
    <style>
      /* A stand-in for Obsidian's default theme variables. */
      body {
        --font-monospace: ui-monospace, "SF Mono", Menlo, monospace;
        --font-ui-small: 13px;
        --font-ui-smaller: 12px;
        --radius-s: 4px;
        --radius-m: 8px;
        --code-background: #f6f6f6;
        --text-error: #e93147;
        --text-faint: #ababab;
        margin: 0;
        padding: 2rem clamp(1rem, 5vw, 4rem) 6rem;
        font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      body.theme-light {
        --background-primary: #ffffff;
        --text-normal: #222222;
        --text-muted: #5c5c5c;
        --text-accent: #8a5cf5;
        background: var(--background-primary);
        color: var(--text-normal);
      }
      body.theme-dark {
        --background-primary: #1e1e1e;
        --text-normal: #dadada;
        --text-muted: #b3b3b3;
        --text-accent: #a68af9;
        --code-background: #262626;
        background: var(--background-primary);
        color: var(--text-normal);
      }
      #root {
        max-width: 760px;
        margin: 0 auto;
      }
      h2 {
        margin: 3rem 0 0.5rem;
        font-size: 1.1rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--text-muted);
      }
      h3 {
        margin: 2rem 0 0.25rem;
        font-size: 0.85rem;
        font-weight: 500;
        color: var(--text-muted);
      }
      .modal-container {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.35);
      }
      .modal {
        display: flex;
        flex-direction: column;
        padding: 1.25rem;
        border-radius: 12px;
        background: var(--background-primary);
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.25);
        --background-modifier-hover: rgba(0, 0, 0, 0.06);
        --shadow-s: 0 1px 2px rgba(0, 0, 0, 0.12);
      }
      .modal-title {
        margin-bottom: 0.75rem;
        font-weight: 600;
      }
      .modal input[type="search"] {
        padding: 0.45rem 0.6rem;
        border: 1px solid #ddd;
        border-radius: 6px;
        font: inherit;
      }
      .modal button {
        border: 0;
        font: inherit;
        cursor: pointer;
      }
      .mod-cta {
        padding: 0.4rem 1rem;
        border-radius: 6px;
        background: #7c5cf5;
        color: white;
      }
      .source {
        font-size: 12px;
        background: var(--code-background);
        padding: 0.75rem;
        overflow: auto;
      }
    </style>
  </head>
  <body class="theme-light">
    <div id="root"></div>
    <script src="./.out/preview.js"></script>
  </body>
</html>
